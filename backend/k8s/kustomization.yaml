# ─────────────────────────────────────────────────────────────────────────────
# Kustomization — base23 k8s/
# Apply: kubectl apply -k k8s/
# Fill k8s/secret.yaml before applying. Replace v1-202608211152 image tags first.
# migrate-job.yaml is intentionally excluded — run manually per release.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: base23

resources:
  - namespace.yaml
  - configmap.yaml
  - nginx-configmap.yaml
  - secret.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - queue-worker-deployment.yaml
  - scheduler-deployment.yaml
  - certificate.yaml
  - ingress.yaml
  - network-policy.yaml

images:
  - name: registry.digitalocean.com/con-reg/base23
    newTag: v2-php84-202608211213
